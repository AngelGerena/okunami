<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/proposals/the-jesus-cartel/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Jesus Cartel | OKUNAMI vCard Proposal</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="The Jesus Cartel, pick your vCard design">
<meta property="og:description" content="Eight looks prepared for The Jesus Cartel by OKUNAMI. Scan. Share. Connect.">
<meta property="og:image" content="https://www.thejesuscartel.com/cdn/shop/files/4346D6E80F86A773CABC087D15CDABCF.jpg?v=1660343456&amp;width=1200">
<meta property="og:url" content="https://okunami.pro/proposals/the-jesus-cartel/">
<meta name="description" content="vCard design proposal for The Jesus Cartel, prepared by OKUNAMI.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;600;700&family=Special+Elite&family=Permanent+Marker&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-look="contraband">

<header class="picker" aria-label="Design picker">
  <div class="picker-top">
    <span class="picker-brand">OKUNAMI</span>
    <span class="picker-label">Design proposal for The Jesus Cartel</span>
  </div>
  <div class="picker-tabs" role="tablist" id="pickerTabs"></div>
  <div class="picker-actions">
    <a class="pick-btn pick-wa" id="pickWa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4a10 10 0 0 0-15.7 12l-1.3 5 5.1-1.3A10 10 0 1 0 20 4Zm-8 16a8 8 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.2-.2-.4-.3Z"/></svg>
      I want this one
    </a>
    <a class="pick-btn pick-sms" id="pickSms" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Text instead
    </a>
  </div>
</header>

<main id="card" class="card-wrap" aria-live="polite"></main>

<div class="qr-full" id="qrFull" hidden>
  <button class="qr-close" id="qrClose" aria-label="Close QR code">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
  <div class="qr-full-box">
    <div id="qrBig"></div>
    <p>Scan to save The Jesus Cartel</p>
  </div>
</div>

<div class="video-modal" id="videoModal" hidden>
  <button class="qr-close" id="videoClose" aria-label="Close video">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
  <div class="video-frame" id="videoFrame"></div>
</div>

<script src="js/qrcode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
